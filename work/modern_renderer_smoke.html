<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smoke</title><style>
:root{--blue:#0b7fd3;--navy:#15253b;--line:#cbd5e1;--soft:#f7f9fc;--green:#17834f;--red:#c43b3b;--amber:#cb8b09}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--navy);font-family:Inter,Arial,sans-serif;font-size:15px}button{font:inherit;cursor:pointer}.topbar{height:78px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 48px}.exam-name{font-weight:750;font-size:16px}.timer{text-align:center;font-size:21px;font-weight:750}.timer button{display:block;margin:4px auto 0;background:#fff;border:1px solid #64748b;border-radius:16px;padding:2px 12px;font-size:12px}.progress-rail{height:7px;display:flex;gap:2px;padding:0 44px}.rail-segment{height:2px;flex:1;background:#94a3b8}.rail-segment.done{background:var(--blue)}.rail-segment.flagged{background:#d49b15}.rail-segment.correct{background:var(--green)}.rail-segment.incorrect{background:var(--red)}main{min-height:calc(100vh - 118px);display:grid;grid-template-columns:1fr 1fr}.pane{padding:44px 7vw;border-top:1px solid #d6dde8}.passage-pane{border-right:1px solid #c5cfdb}.passage{font-family:Georgia,serif;line-height:1.55;font-size:17px;white-space:pre-wrap;min-height:360px;max-height:65vh;overflow:auto}.passage-tools{display:flex;gap:10px;margin:0 0 20px}.text-button{background:#fff;border:1px solid #8da0b7;border-radius:6px;padding:7px 11px;font-weight:650}.text-button.active{background:#fff2bf;border-color:#d49b15}.question-meta{display:flex;align-items:center;gap:10px;border-bottom:2px solid #d5dce5;padding-bottom:10px;font-weight:750}.number-badge{background:#101820;color:#fff;padding:6px 9px;border-radius:3px}.flag-button{border:0;background:transparent;color:#334155;font-weight:700}.flag-button.flagged{color:#b4233b}.question-text{font-family:Georgia,serif;line-height:1.55;font-size:17px;margin:18px 0}.exam-image{max-width:100%;display:none;margin:16px 0;border:1px solid var(--line)}.choice{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #334155;border-radius:8px;padding:15px;margin:11px 0;line-height:1.4}.choice:hover{border-color:var(--blue)}.choice.selected{border:2px solid var(--blue);box-shadow:0 0 0 2px #d9efff}.choice.correct{border-color:var(--green);background:#eaf8ef}.choice.wrong{border-color:var(--red);background:#fff0f0}.choice input{margin:3px 0 0}.choice-key{font-weight:750}.bottom-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid #d8e0e9;padding:16px 44px;display:flex;justify-content:space-between;align-items:center}.primary{background:var(--blue);color:white;border:0;border-radius:24px;padding:11px 22px;font-weight:750}.secondary{background:#fff;color:#1f334d;border:1px solid #94a3b8;border-radius:24px;padding:10px 20px;font-weight:700}.nav-modal,.results-modal{position:fixed;inset:0;background:rgb(15 23 42 / .22);display:none;align-items:center;justify-content:center;padding:24px;z-index:5}.nav-modal.open,.results-modal.open{display:flex}.modal-card{width:min(610px,96vw);background:#fff;border:1px solid #d5dde7;border-radius:13px;box-shadow:0 18px 45px rgb(15 23 42 / .25);padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d5dde7;padding-bottom:13px}.modal-title{font-weight:800}.close{border:0;background:transparent;font-size:22px}.legend,.filter-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:15px 0}.legend span{font-size:13px}.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;border:1px solid #64748b}.filter{border:1px solid #a8b5c4;background:#fff;border-radius:16px;padding:5px 11px;font-size:13px}.filter.active{background:#e5f3ff;border-color:var(--blue);color:#0369a1}.question-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}.question-tile{min-height:36px;border:1px dashed #8ca0b6;background:#fff;color:#1f4f7d;font-weight:750}.question-tile.current{outline:3px solid #172e4d}.question-tile.done{background:#e1f2ff;border-color:var(--blue);border-style:solid}.question-tile.flagged{box-shadow:inset 0 3px #c1324c}.question-tile.correct{background:#dff4e8;color:#17613b;border-color:var(--green);border-style:solid}.question-tile.incorrect{background:#ffe5e5;color:#9d2424;border-color:var(--red);border-style:solid}.results-copy{color:#475569;margin:8px 0 18px;line-height:1.5}.results-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}.result-tile{min-height:48px;border-radius:8px;border:0;font-weight:800;color:#fff}.result-tile.correct{background:var(--green)}.result-tile.incorrect{background:var(--red)}.result-tile.unscored{background:#64748b}@media(max-width:820px){.topbar{padding:0 20px}main{grid-template-columns:1fr}.passage-pane{border-right:0}.pane{padding:28px 7vw}.question-grid{grid-template-columns:repeat(6,1fr)}.results-grid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header class="topbar"><div class="exam-name">Practice module</div><div class="timer"><span id="timer"></span><button id="timerToggle" onclick="toggleTimer()">Pause</button></div><div></div></header><div class="progress-rail" id="progressRail"></div><main><section class="pane passage-pane"><div class="passage-tools"><button class="text-button" id="highlightToggle" onclick="toggleHighlight()">Highlight off</button></div><div class="passage" id="passage" contenteditable="true"></div></section><section class="pane"><div class="question-meta"><span class="number-badge" id="number"></span><button class="flag-button" id="flagButton" onclick="toggleFlag()">▮ Mark for review</button></div><div class="question-text" id="question"></div><img class="exam-image" id="image"><div id="choices"></div></section></main><footer class="bottom-actions"><button class="secondary" onclick="previous()">Previous</button><button class="secondary" onclick="openNavigator()">Questions</button><button class="primary" id="nextButton" onclick="next()">Next</button><button class="primary" id="submitButton" onclick="submitExam()">Submit test</button></footer><div class="nav-modal" id="navModal"><section class="modal-card"><div class="modal-head"><span class="modal-title">Questions</span><button class="close" onclick="closeNavigator()">×</button></div><div class="legend"><span><i style="background:#dff4e8"></i>Answered</span><span><i style="background:#fff"></i>Unanswered</span><span><i style="background:#fff;border-top:4px solid #c1324c"></i>Marked</span></div><div class="filter-row"><button class="filter active" data-filter="all" onclick="setFilter('all')">All</button><button class="filter" data-filter="done" onclick="setFilter('done')">Answered</button><button class="filter" data-filter="flagged" onclick="setFilter('flagged')">Marked</button><button class="filter" data-filter="unanswered" onclick="setFilter('unanswered')">Unanswered</button></div><div class="question-grid" id="navGrid"></div></section></div><div class="results-modal" id="resultsModal"><section class="modal-card"><div class="modal-head"><span class="modal-title" id="resultsTitle">Review results</span><button class="close" onclick="closeResults()">×</button></div><p class="results-copy" id="resultsCopy"></p><div class="results-grid" id="resultsGrid"></div></section></div><script>
const exam={"questions": [{"number": 1, "passage": "A <u>claim<\/u>.", "question": "Choose.", "choices": ["A", "B", "C", "D"], "answer": "B", "images": []}, {"number": 2, "question": "Second?", "choices": ["One", "Two", "Three", "Four"], "answer": "C", "images": []}], "images": {}, "duration": 1800};const qs=exam.questions;let current=0,answers={},flags={},passageMarkup={},submitted=false,highlightMode=false,navFilter='all',remaining=exam.duration,timerRunning=true,timerHandle=null;
function escapeHtml(value){const el=document.createElement('div');el.textContent=value||'';return el.innerHTML}function formatText(value){return escapeHtml(value).replace(/&lt;(\/?)(u|b|i)&gt;/gi,'<$1$2>')}function state(index){const q=qs[index];if(submitted&&q.answer)return answers[index]===q.answer?'correct':'incorrect';if(answers[index])return'done';return'unanswered'}function savePassage(){passageMarkup[current]=document.querySelector('#passage').innerHTML}function navigate(index){savePassage();current=index;render()}function render(){const q=qs[current];document.querySelector('#number').textContent=current+1;document.querySelector('#passage').innerHTML=passageMarkup[current]||formatText(q.passage||'No passage');document.querySelector('#question').innerHTML=formatText(q.question);const image=document.querySelector('#image'),item=exam.images[q.image_id];if(item){image.src='data:'+item.mime+';base64,'+item.data;image.style.display='block'}else image.style.display='none';document.querySelector('#choices').innerHTML=Object.entries(q.choices).map(([key,value])=>`<label class="choice ${answers[current]===key?'selected':''}" data-key="${key}"><input type="radio" name="answer" ${answers[current]===key?'checked':''} ${submitted?'disabled':''} onchange="answer('${key}')"><span><span class="choice-key">${key}.</span> ${formatText(value)}</span></label>`).join('');if(submitted)markResults();const flag=document.querySelector('#flagButton');flag.classList.toggle('flagged',!!flags[current]);flag.textContent=(flags[current]?'▮ ':'▯ ')+'Mark for review';document.querySelector('#nextButton').style.visibility=current===qs.length-1?'hidden':'visible';document.querySelector('#submitButton').style.display=submitted?'none':'inline-block';renderRail();renderNavigator()}function answer(key){if(!submitted){answers[current]=key;render()}}function previous(){if(current>0)navigate(current-1)}function next(){if(current<qs.length-1)navigate(current+1)}function toggleFlag(){if(!submitted){flags[current]=!flags[current];render()}}function renderRail(){document.querySelector('#progressRail').innerHTML=qs.map((_,i)=>`<span class="rail-segment ${state(i)} ${flags[i]?'flagged':''}"></span>`).join('')}function openNavigator(){document.querySelector('#navModal').classList.add('open');renderNavigator()}function closeNavigator(){document.querySelector('#navModal').classList.remove('open')}function setFilter(filter){navFilter=filter;renderNavigator()}function matchesFilter(index){const itemState=state(index);return navFilter==='all'||itemState===navFilter||(navFilter==='flagged'&&flags[index])}function renderNavigator(){document.querySelectorAll('.filter').forEach(button=>button.classList.toggle('active',button.dataset.filter===navFilter));document.querySelector('#navGrid').innerHTML=qs.map((_,i)=>matchesFilter(i)?`<button class="question-tile ${state(i)} ${flags[i]?'flagged':''} ${i===current?'current':''}" onclick="closeNavigator();navigate(${i})">${i+1}</button>`:'').join('')}function toggleHighlight(){highlightMode=!highlightMode;const button=document.querySelector('#highlightToggle');button.textContent=highlightMode?'Highlight on':'Highlight off';button.classList.toggle('active',highlightMode)}document.querySelector('#passage').addEventListener('mouseup',()=>{const selection=window.getSelection(),passage=document.querySelector('#passage');if(highlightMode&&selection&&selection.toString().trim()&&passage.contains(selection.anchorNode)){document.execCommand('hiliteColor',false,'#fff19b');setTimeout(savePassage,0)}});function markResults(){document.querySelectorAll('.choice').forEach(el=>{const key=el.dataset.key,q=qs[current];el.classList.toggle('correct',q.answer===key);el.classList.toggle('wrong',answers[current]===key&&q.answer&&q.answer!==key)})}function submitExam(){submitted=true;timerRunning=false;clearInterval(timerHandle);const keyed=qs.filter(q=>q.answer);const correct=qs.reduce((count,q,i)=>count+(q.answer&&answers[i]===q.answer?1:0),0);document.querySelector('#resultsTitle').textContent=keyed.length?`Score: ${correct} / ${keyed.length}`:`Completed ${Object.keys(answers).length} / ${qs.length}`;document.querySelector('#resultsCopy').textContent=keyed.length?'Choose a question to review your answer and the correct answer. Green is correct; red is incorrect or unanswered.':'This exam has no answer key, so it cannot be scored.';document.querySelector('#resultsGrid').innerHTML=qs.map((q,i)=>`<button class="result-tile ${q.answer?state(i):'unscored'}" onclick="reviewResult(${i})">${i+1}</button>`).join('');document.querySelector('#resultsModal').classList.add('open');render()}function reviewResult(index){document.querySelector('#resultsModal').classList.remove('open');navigate(index)}function closeResults(){document.querySelector('#resultsModal').classList.remove('open')}function toggleTimer(){timerRunning=!timerRunning;document.querySelector('#timerToggle').textContent=timerRunning?'Pause':'Resume'}function tick(){const minutes=Math.floor(remaining/60),seconds=remaining%60;document.querySelector('#timer').textContent=`${minutes}:${String(seconds).padStart(2,'0')}`;if(timerRunning&&remaining>0)remaining--;else if(timerRunning&&remaining===0)submitExam()}timerHandle=setInterval(tick,1000);tick();render();
</script></body></html>
